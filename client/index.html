<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=816">
  <title>JIN Chat — POC</title>
  <link rel="stylesheet" href="chat-overlay.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
    }

    /* Simulated 816×624 RPG Maker canvas */
    .game-wrapper {
      position: relative;
      width: 816px;
      height: 624px;
      flex-shrink: 0;
    }

    .game-canvas {
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 40% 60%, #1e3a14 0%, #112209 40%, #080f05 100%);
      position: relative;
      overflow: hidden;
    }

    /* Fake pixel grid overlay for atmosphere */
    .game-canvas::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    .game-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.06);
      font-size: 13px;
      text-align: center;
      pointer-events: none;
      line-height: 2;
    }

    /* HUD indicator in top-right (simulated) */
    .game-hud {
      position: absolute;
      top: 8px;
      right: 8px;
      color: rgba(200, 168, 75, 0.25);
      font-size: 10px;
      text-align: right;
      pointer-events: none;
      line-height: 1.6;
    }

    /* Dev controls panel below canvas */
    .dev-panel {
      width: 816px;
      background: rgba(14, 11, 6, 0.95);
      border: 1px solid #3a2a06;
      border-top: none;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .dev-label {
      color: #6a5230;
      font-size: 10px;
      font-family: 'Courier New', monospace;
    }

    .dev-btn {
      background: rgba(40, 28, 4, 0.9);
      border: 1px solid #7a5c10;
      color: #c8a84b;
      padding: 3px 10px;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      font-size: 11px;
    }

    .dev-btn:hover { background: rgba(60, 42, 6, 0.95); }

    .dev-input {
      background: rgba(6, 4, 1, 0.85);
      border: 1px solid #3a2a06;
      color: #e8dcc8;
      padding: 3px 7px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      width: 160px;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <div class="game-canvas">
      <div class="game-label">
        [ Canvas RPG Maker MV — 816 × 624 px ]<br>
        Carte : Forêt des Débuts<br>
        <br>
        ← Le chat est en bas à gauche
      </div>
      <div class="game-hud">
        ♥ 100 / 100<br>
        ◆ 80 / 80<br>
        Lv. 5
      </div>

      <!-- Chat overlay mount point — dans le vrai jeu, ce div est injecté par le plugin -->
      <div id="jin-chat-root"></div>
    </div>

    <!-- Dev controls — ne fait pas partie du chat, juste pour le POC -->
    <div class="dev-panel">
      <span class="dev-label">POC controls :</span>
      <button class="dev-btn" onclick="JinChat.toggle()">Toggle chat [Entrée]</button>
      <button class="dev-btn" onclick="simulateMessage()">Simuler message</button>
      <input class="dev-input" id="sim-name" value="Nordine Ateur" placeholder="Pseudo simulé">
      <span class="dev-label" id="dev-status">Non connecté</span>
    </div>
  </div>

  <!-- socket.io client (CDN pour le POC — dans le plugin RMMV, on l'injecte aussi par script tag) -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="chat-overlay.js"></script>
  <script>
    // ── Configuration POC ────────────────────────────────────────────────────
    // Dans le vrai plugin RPG Maker :
    //   playerName  = $gameActors.actor(1).name()
    //   getMapName  = function() { return $gameMap.displayName(); }
    //
    // Ici on simule sans RPG Maker : playerName = null → affiche le prompt pseudo

    JinChat.init({
      serverUrl: 'http://localhost:3001',
      playerName: null,             // null = prompt username (POC sans RPG Maker)
      getMapName: function () {
        return 'Forêt des Débuts'; // simulé — RPG Maker renvoie $gameMap.displayName()
      }
    });

    // Track connection status in dev panel
    (function watchStatus() {
      setInterval(function () {
        fetch('http://localhost:3001/health')
          .then(function (r) { return r.json(); })
          .then(function (d) {
            document.getElementById('dev-status').textContent =
              'Serveur OK — ' + d.players + ' joueur(s)';
          })
          .catch(function () {
            document.getElementById('dev-status').textContent = 'Serveur hors ligne';
          });
      }, 3000);
    })();

    // Simulated incoming message (dev helper)
    function simulateMessage() {
      var name = document.getElementById('sim-name').value || 'Nordine Ateur';
      // On emit via socket pour que ça passe par le serveur et revienne à tous
      fetch('http://localhost:3001/health').then(function () {
        // On ne peut pas émettre directement depuis l'extérieur, on utilise notre propre socket
        // Astuce POC : on crée une connexion temporaire
        var tmp = io('http://localhost:3001');
        tmp.on('connect', function () {
          tmp.emit('chat:send', {
            name: name,
            text: 'Message test depuis ' + name + ' !',
            map: 'Arène'
          });
          setTimeout(function () { tmp.disconnect(); }, 500);
        });
      });
    }
  </script>

</body>
</html>
